name: Check Sanity integration

on:
  pull_request:
    paths:
      - 'studio/**'
      - '.github/workflows/studio-check.yml'
  push:
    branches:
      - master
    paths:
      - 'studio/**'
      - '.github/workflows/studio-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Install Studio dependencies
        run: npm ci --prefix studio

      - name: Check Sanity integration
        run: npm run check --prefix studio
